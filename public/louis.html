<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NebuDate – Louis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000510; cursor:none !important; }
    * { cursor:none !important; }

    #space-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

    /* ── TITRE haut-gauche ── */
    #page-title {
      position:fixed; top:.9rem; left:1.4rem; z-index:20;
      pointer-events:none;
    }
    #page-title .lbl {
      font-family:'Syne',sans-serif; font-weight:300;
      font-size:.65rem; letter-spacing:.22em; text-transform:uppercase;
      color:rgba(154,220,255,.45); display:block; margin-bottom:.1rem;
    }
    #page-title .name {
      font-family:'Orbitron',sans-serif; font-weight:900;
      font-size:1.4rem; letter-spacing:.14em; text-transform:uppercase;
      background:linear-gradient(130deg,#9adcff 0%,#e0f4ff 40%,#fff 55%,#c8b8ff 80%,#8ba8ff 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 12px rgba(154,220,255,.45));
    }

    /* ── LOGO haut-droite ── */
    #logo-small {
      position:fixed; top:1.1rem; right:2rem; z-index:20;
      font-family:'Orbitron',sans-serif; font-weight:900; font-size:1rem;
      letter-spacing:.18em; text-transform:uppercase;
      background:linear-gradient(130deg,#9adcff 0%,#fff 45%,#c8b8ff 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 9px rgba(154,220,255,.45));
    }

    /* ── CALENDRIER (centre) ── */
    #calendar-panel {
      position:fixed;
      top: 3.6rem; left: 1rem; right: 326px; bottom: 3rem;
      z-index:10; pointer-events:all;
      display:flex; flex-direction:column;
      background:rgba(2,8,22,.6);
      border:1px solid rgba(154,220,255,.1);
      border-radius:6px; backdrop-filter:blur(14px);
      box-shadow:0 0 40px rgba(26,63,140,.35);
      overflow:hidden;
    }

    /* Header mois */
    #cal-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:.55rem 1rem;
      border-bottom:1px solid rgba(154,220,255,.09);
      background:rgba(154,220,255,.03); flex-shrink:0;
    }
    #cal-month-label {
      font-family:'Orbitron',sans-serif; font-weight:700;
      font-size:.82rem; letter-spacing:.16em; text-transform:uppercase;
      color:rgba(220,240,255,.85);
    }
    .cal-nav {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.75rem;
      letter-spacing:.1em; padding:.3rem .75rem; border-radius:2px;
      border:1px solid rgba(154,220,255,.15);
      background:rgba(10,28,70,.7); color:rgba(154,220,255,.65);
      cursor:none !important; transition:color .2s,border-color .2s,box-shadow .2s;
    }
    .cal-nav:hover:not(:disabled) {
      color:rgba(154,220,255,1); border-color:rgba(154,220,255,.4);
      box-shadow:0 0 14px rgba(154,220,255,.18);
    }
    .cal-nav:disabled { opacity:.25; }

    /* En-tête jours */
    #cal-daynames {
      display:grid; grid-template-columns:repeat(7,1fr);
      border-bottom:1px solid rgba(154,220,255,.07);
      flex-shrink:0; background:rgba(154,220,255,.02);
    }
    #cal-daynames div {
      font-family:'Syne',sans-serif; font-size:.65rem; font-weight:600;
      letter-spacing:.12em; text-transform:uppercase; text-align:center;
      color:rgba(154,220,255,.4); padding:.35rem 0;
    }

    /* Corps calendrier */
    #cal-body {
      flex:1; overflow:hidden;
      display:flex; flex-direction:column;
    }

    /* Semaine */
    .cal-week { flex:1; display:flex; flex-direction:column; border-bottom:1px solid rgba(154,220,255,.05); }
    .cal-week:last-child { border-bottom:none; }

    /* Barre d'événements multi-jours */
    .cal-eventsbar {
      position:relative; min-height:4px;
      border-bottom:1px solid rgba(154,220,255,.04);
    }

    /* Bar d'événement */
    .cal-event-bar {
      position:absolute; height:18px; border-radius:2px;
      font-family:'Syne',sans-serif; font-size:.62rem; font-weight:600;
      letter-spacing:.04em; color:rgba(255,255,255,.92);
      padding:0 6px; line-height:18px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      cursor:none !important;
      transition:filter .15s;
    }
    .cal-event-bar:hover { filter:brightness(1.2); }

    /* Cellules jours */
    .cal-week-days {
      flex:1; display:grid; grid-template-columns:repeat(7,1fr);
    }
    .cal-day-cell {
      min-height:0; padding:.3rem .35rem;
      border-right:1px solid rgba(154,220,255,.05);
      cursor:none !important; position:relative;
      transition:background .15s;
    }
    .cal-day-cell:last-child { border-right:none; }
    .cal-day-cell:hover:not(.past) { background:rgba(154,220,255,.04); }
    .cal-day-cell.other-month { opacity:.3; }
    .cal-day-cell.past { opacity:.4; }

    .cal-day-num {
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:50%;
      font-family:'Syne',sans-serif; font-size:.78rem; font-weight:600;
      color:rgba(195,220,255,.7);
    }
    .cal-day-cell.today .cal-day-num {
      background:rgba(154,220,255,.18);
      color:rgba(154,220,255,1);
      box-shadow:0 0 10px rgba(154,220,255,.3);
    }

    .add-evt-hint {
      position:absolute; bottom:4px; right:5px;
      font-family:'Syne',sans-serif; font-size:.6rem; letter-spacing:.06em;
      color:rgba(154,220,255,.3); opacity:0; transition:opacity .15s;
    }
    .cal-day-cell:hover:not(.past) .add-evt-hint { opacity:1; }

    /* ── CHAT (bas-droite) ── */
    #chat-panel {
      position:fixed;
      right:1rem; bottom:3rem;
      width:310px; height:400px;
      z-index:10; pointer-events:all;
      display:flex; flex-direction:column;
      background:rgba(2,8,22,.72);
      border:1px solid rgba(154,220,255,.12);
      border-radius:6px; backdrop-filter:blur(14px);
      box-shadow:0 0 30px rgba(26,63,140,.4);
      overflow:hidden;
    }

    #chat-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:.45rem .8rem;
      border-bottom:1px solid rgba(154,220,255,.09);
      background:rgba(154,220,255,.03); flex-shrink:0;
    }
    #chat-header-left { display:flex; align-items:center; gap:.45rem; }
    .chat-dot {
      width:6px; height:6px; border-radius:50%;
      background:#9adcff; box-shadow:0 0 7px rgba(154,220,255,.8);
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #chat-title {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.62rem;
      letter-spacing:.16em; text-transform:uppercase; color:rgba(154,220,255,.65);
    }
    #chat-identity-badge {
      font-family:'Syne',sans-serif; font-size:.66rem; letter-spacing:.06em;
      padding:.15rem .55rem; border-radius:2px;
      background:rgba(154,220,255,.06); border:1px solid rgba(154,220,255,.14);
      color:rgba(195,235,255,.55);
    }
    #chat-identity-badge span { color:rgba(154,220,255,.9); font-weight:600; }

    #chat-messages {
      flex:1; overflow-y:auto; display:flex; flex-direction:column;
      gap:.5rem; padding:.7rem .75rem; scroll-behavior:smooth;
    }
    #chat-messages::-webkit-scrollbar { width:3px; }
    #chat-messages::-webkit-scrollbar-track { background:transparent; }
    #chat-messages::-webkit-scrollbar-thumb { background:rgba(154,220,255,.15); border-radius:2px; }

    #chat-empty {
      flex:1; display:flex; align-items:center; justify-content:center;
      font-family:'Syne',sans-serif; font-size:.75rem; letter-spacing:.1em;
      color:rgba(154,220,255,.22); text-align:center;
    }

    .msg-row { display:flex; flex-direction:column; max-width:82%; gap:.14rem; animation:msgIn .2s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
    .msg-row.me  { align-self:flex-end; align-items:flex-end; }
    .msg-row.other { align-self:flex-start; align-items:flex-start; }
    .msg-name { font-family:'Syne',sans-serif; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(154,220,255,.4); }
    .msg-bubble {
      padding:.4rem .7rem; border-radius:4px;
      font-family:'Syne',sans-serif; font-size:.8rem; line-height:1.5;
      word-break:break-word;
    }
    .msg-row.me .msg-bubble {
      background:linear-gradient(135deg,rgba(26,63,140,.7),rgba(15,38,95,.8));
      border:1px solid rgba(154,220,255,.2); color:rgba(220,240,255,.92);
    }
    .msg-row.other .msg-bubble {
      background:linear-gradient(135deg,rgba(60,30,100,.65),rgba(40,15,75,.75));
      border:1px solid rgba(200,180,255,.16); color:rgba(225,215,255,.9);
    }
    .msg-time { font-family:'Syne',sans-serif; font-size:.58rem; color:rgba(154,220,255,.25); }
    .date-sep {
      display:flex; align-items:center; gap:.5rem;
      font-family:'Syne',sans-serif; font-size:.6rem; letter-spacing:.12em;
      color:rgba(154,220,255,.28); text-transform:uppercase; margin:.2rem 0;
    }
    .date-sep::before,.date-sep::after {
      content:''; flex:1; height:1px;
      background:linear-gradient(90deg,transparent,rgba(154,220,255,.15),transparent);
    }

    #chat-input-row {
      display:flex; gap:.4rem; padding:.5rem .6rem;
      border-top:1px solid rgba(154,220,255,.09);
      background:rgba(154,220,255,.02); flex-shrink:0;
    }
    #chat-input {
      flex:1; background:rgba(5,15,40,.6); border:1px solid rgba(154,220,255,.15);
      border-radius:3px; padding:.42rem .65rem;
      font-family:'Syne',sans-serif; font-size:.8rem;
      color:rgba(220,240,255,.9); outline:none; cursor:none !important;
      caret-color:rgba(154,220,255,.9); transition:border-color .2s;
    }
    #chat-input::placeholder { color:rgba(154,220,255,.22); }
    #chat-input:focus { border-color:rgba(154,220,255,.36); }
    #chat-send {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.62rem;
      letter-spacing:.1em; text-transform:uppercase; padding:.42rem .9rem;
      border:1px solid rgba(154,220,255,.2); border-radius:3px;
      background:linear-gradient(160deg,rgba(10,28,70,.9),rgba(18,45,100,.9));
      color:rgba(154,220,255,.65); cursor:none !important;
      transition:color .2s,box-shadow .2s,transform .15s,border-color .2s;
    }
    #chat-send:hover:not(:disabled) {
      color:#9adcff; border-color:rgba(154,220,255,.45);
      box-shadow:0 0 14px rgba(154,220,255,.2); transform:translateY(-1px);
    }
    #chat-send:disabled { opacity:.3; }
    #chat-status {
      font-family:'Syne',sans-serif; font-size:.62rem; color:rgba(154,220,255,.3);
      text-align:center; padding:.18rem 0 .08rem; min-height:1rem; flex-shrink:0;
    }

    /* ── BOUTON RETOUR (bas-centre) ── */
    #btn-back {
      position:fixed; bottom:.7rem; left:50%; transform:translateX(-50%);
      z-index:20; pointer-events:all;
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.68rem;
      letter-spacing:.16em; text-transform:uppercase; padding:.5rem 1.5rem;
      border-radius:2px; border:none; outline:none;
      background:linear-gradient(160deg,#080f22,#0e1e42);
      color:rgba(154,220,255,.5); cursor:none !important;
      box-shadow:0 0 0 1px rgba(154,220,255,.1),inset 0 1px 0 rgba(154,220,255,.05);
      transition:color .25s,box-shadow .25s,transform .25s;
    }
    #btn-back:hover {
      color:rgba(154,220,255,.85); transform:translateX(-50%) translateY(-2px);
      box-shadow:0 0 0 1px rgba(154,220,255,.3),0 4px 20px rgba(26,63,140,.5);
    }
    #btn-back:active { transform:translateX(-50%) scale(.97); }

    /* ── MODALS ── */
    .modal-overlay {
      display:none; position:fixed; inset:0; z-index:100;
      background:rgba(0,3,16,.78); backdrop-filter:blur(8px);
      align-items:center; justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal-box {
      background:rgba(4,12,34,.95);
      border:1px solid rgba(154,220,255,.18); border-radius:6px;
      padding:1.6rem 1.8rem 1.4rem; width:380px; max-width:95vw;
      box-shadow:0 0 60px rgba(26,63,140,.55);
      animation:boxIn .28s cubic-bezier(.22,.68,0,1.2);
    }
    @keyframes boxIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    .modal-heading {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.82rem;
      letter-spacing:.18em; text-transform:uppercase;
      color:rgba(220,240,255,.85); margin-bottom:1.1rem;
    }
    .form-group { display:flex; flex-direction:column; gap:.35rem; margin-bottom:.75rem; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-bottom:.75rem; }
    .form-label {
      font-family:'Syne',sans-serif; font-size:.68rem; letter-spacing:.1em;
      text-transform:uppercase; color:rgba(154,220,255,.5);
    }
    .form-input {
      background:rgba(5,15,40,.7); border:1px solid rgba(154,220,255,.16);
      border-radius:3px; padding:.45rem .65rem;
      font-family:'Syne',sans-serif; font-size:.82rem;
      color:rgba(220,240,255,.9); outline:none; cursor:auto !important;
      caret-color:rgba(154,220,255,.9); transition:border-color .2s;
    }
    .form-input:focus { border-color:rgba(154,220,255,.38); }
    .form-input[type="date"],.form-input[type="time"] { cursor:none !important; }
    /* Style des inputs date/time natifs */
    .form-input::-webkit-calendar-picker-indicator { filter:invert(1) opacity(.5); }

    /* Couleurs */
    .color-picker { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.2rem; }
    .color-dot {
      width:22px; height:22px; border-radius:50%;
      cursor:none !important; border:2px solid transparent;
      transition:transform .15s,border-color .15s;
    }
    .color-dot:hover { transform:scale(1.2); }
    .color-dot.selected { border-color:rgba(255,255,255,.7); transform:scale(1.15); }

    .modal-actions { display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.1rem; }
    .btn-modal-cancel {
      font-family:'Syne',sans-serif; font-size:.78rem; padding:.45rem 1rem;
      border:1px solid rgba(154,220,255,.15); border-radius:3px;
      background:transparent; color:rgba(154,220,255,.5); cursor:none !important;
      transition:color .2s,border-color .2s;
    }
    .btn-modal-cancel:hover { color:rgba(154,220,255,.8); border-color:rgba(154,220,255,.35); }
    .btn-modal-save {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.72rem;
      letter-spacing:.12em; text-transform:uppercase; padding:.5rem 1.2rem;
      border:1px solid rgba(154,220,255,.25); border-radius:3px;
      background:linear-gradient(160deg,rgba(10,28,70,.9),rgba(18,45,100,.9));
      color:rgba(154,220,255,.8); cursor:none !important;
      transition:color .2s,box-shadow .2s,border-color .2s;
    }
    .btn-modal-save:hover {
      color:#9adcff; border-color:rgba(154,220,255,.5);
      box-shadow:0 0 16px rgba(154,220,255,.22);
    }
    .btn-modal-delete {
      font-family:'Syne',sans-serif; font-size:.78rem; padding:.45rem 1rem;
      border:1px solid rgba(255,80,80,.25); border-radius:3px;
      background:transparent; color:rgba(255,120,120,.6); cursor:none !important;
      transition:color .2s,border-color .2s;
    }
    .btn-modal-delete:hover { color:rgba(255,120,120,.9); border-color:rgba(255,80,80,.5); }

    /* Detail event */
    #detail-colorbar { height:4px; border-radius:2px; margin-bottom:1rem; }
    #detail-title { font-family:'Orbitron',sans-serif; font-weight:700; font-size:.88rem; letter-spacing:.12em; color:rgba(220,240,255,.9); margin-bottom:.6rem; }
    #detail-info { font-family:'Syne',sans-serif; font-size:.8rem; color:rgba(195,220,255,.6); line-height:1.6; }

    /* ── Coccinelle ── */
    #cursor-bug { position:fixed; pointer-events:none; z-index:99999; top:0; left:0; width:0; height:0; }
    #bug-body { position:absolute; transform:translate(-50%,-28%); will-change:transform; pointer-events:none; }
    #bug-body svg { pointer-events:none; }
    .fw { opacity:0; transition:opacity .12s ease; }
    .fw-l { transform-box:fill-box; transform-origin:right center; }
    .fw-r { transform-box:fill-box; transform-origin:left center; }
    #cursor-bug.is-flying .fw  { opacity:1; }
    #cursor-bug.is-flying .fw-l { animation:flapL .13s ease-in-out infinite alternate; }
    #cursor-bug.is-flying .fw-r { animation:flapR .13s ease-in-out infinite alternate; }
    @keyframes flapL { from{transform:rotate(-6deg) scaleY(.60)} to{transform:rotate(-42deg) scaleY(1)} }
    @keyframes flapR { from{transform:rotate(6deg) scaleY(.60)} to{transform:rotate(42deg) scaleY(1)} }
  </style>
</head>
<body>

<canvas id="space-canvas"></canvas>

<!-- TITRE haut-gauche -->
<div id="page-title">
  <span class="lbl">Réservation avec</span>
  <span class="name">Louis</span>
</div>

<!-- LOGO haut-droite -->
<div id="logo-small">NebuDate</div>

<!-- CALENDRIER -->
<div id="calendar-panel">
  <div id="cal-header">
    <button class="cal-nav" id="cal-prev">←</button>
    <span id="cal-month-label"></span>
    <button class="cal-nav" id="cal-next">→</button>
  </div>
  <div id="cal-daynames">
    <div>Lun</div><div>Mar</div><div>Mer</div>
    <div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
  </div>
  <div id="cal-body"></div>
</div>

<!-- CHAT -->
<div id="chat-panel">
  <div id="chat-header">
    <div id="chat-header-left">
      <div class="chat-dot"></div>
      <span id="chat-title">Canal privé</span>
    </div>
    <div id="chat-identity-badge">Connecté en tant que <span id="my-name">…</span></div>
  </div>
  <div id="chat-messages">
    <div id="chat-empty">Aucun message…<br>Soyez le premier ✦</div>
  </div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Votre message…" maxlength="500" autocomplete="off">
    <button id="chat-send">Envoyer</button>
  </div>
  <div id="chat-status"></div>
</div>

<!-- RETOUR -->
<button id="btn-back" onclick="window.location.href='index.html'">← Retour</button>

<!-- MODAL CRÉATION ÉVÉNEMENT -->
<div id="event-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-heading">Nouvel événement</div>
    <div class="form-group">
      <label class="form-label">Titre *</label>
      <input class="form-input" id="evt-title" type="text" placeholder="Titre de l'événement…" maxlength="100">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Début</label>
        <input class="form-input" id="evt-start-date" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">Fin</label>
        <input class="form-input" id="evt-end-date" type="date">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Heure début</label>
        <input class="form-input" id="evt-start-time" type="time">
      </div>
      <div class="form-group">
        <label class="form-label">Heure fin</label>
        <input class="form-input" id="evt-end-time" type="time">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Couleur</label>
      <div class="color-picker" id="color-picker">
        <div class="color-dot selected" data-color="blue"   style="background:rgba(30,100,220,.9)"></div>
        <div class="color-dot"          data-color="purple" style="background:rgba(120,40,200,.9)"></div>
        <div class="color-dot"          data-color="teal"   style="background:rgba(0,160,180,.9)"></div>
        <div class="color-dot"          data-color="pink"   style="background:rgba(200,40,120,.9)"></div>
        <div class="color-dot"          data-color="green"  style="background:rgba(30,180,100,.9)"></div>
        <div class="color-dot"          data-color="orange" style="background:rgba(200,120,20,.9)"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="evt-cancel">Annuler</button>
      <button class="btn-modal-save"   id="evt-save">Créer l'événement</button>
    </div>
  </div>
</div>

<!-- MODAL DÉTAIL ÉVÉNEMENT -->
<div id="detail-modal" class="modal-overlay">
  <div class="modal-box">
    <div id="detail-colorbar"></div>
    <div id="detail-title"></div>
    <div id="detail-info"></div>
    <div class="modal-actions">
      <button class="btn-modal-delete" id="detail-delete">Supprimer</button>
      <button class="btn-modal-save"   id="detail-close">Fermer</button>

/* ════════════════════════════════════════

const canvas=document.getElementById('space-canvas'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
const NSTARS=380;
const stars=Array.from({length:NSTARS},()=>({x:Math.random(),y:Math.random(),r:Math.pow(Math.random(),2)*2+.25,base:Math.random()*.6+.25,speed:Math.random()*.8+.3,phase:Math.random()*Math.PI*2}));
const nebulae=[{cx:.14,cy:.28,rx:.32,ry:.20,rot:.4,c1:'rgba(55,0,110,',c2:'rgba(0,35,95,'},{cx:.78,cy:.62,rx:.26,ry:.18,rot:-.2,c1:'rgba(0,70,110,',c2:'rgba(50,0,90,'},{cx:.52,cy:.12,rx:.22,ry:.14,rot:.1,c1:'rgba(0,55,80,',c2:'rgba(35,0,95,'},{cx:.85,cy:.80,rx:.20,ry:.12,rot:.6,c1:'rgba(80,0,80,',c2:'rgba(0,40,80,'}];
const PLT={cx:.80,cy:.20,r:55};
let shooters=[],lastSpawn=0,nextDelay=3+Math.random()*5;
function spawnShooter(){const angle=Math.PI/5+(Math.random()-.5)*.4;shooters.push({x0:Math.random()*.7,y0:Math.random()*.35,angle,len:90+Math.random()*130,life:0,dur:1.6+Math.random()*.8});}
let lastT=0;
function draw(ts){
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  const bg=ctx.createLinearGradient(0,0,W*.4,H);
  bg.addColorStop(0,'#000610');bg.addColorStop(.5,'#020a1c');bg.addColorStop(1,'#010611');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  nebulae.forEach(n=>{
    const nx=n.cx*W,ny=n.cy*H,nrx=n.rx*Math.min(W,H),nry=n.ry*Math.min(W,H);
    ctx.save();ctx.translate(nx,ny);ctx.rotate(n.rot);ctx.scale(1,nry/nrx);
    const g=ctx.createRadialGradient(0,0,0,0,0,nrx);
    g.addColorStop(0,n.c1+'0.16)');g.addColorStop(.45,n.c2+'0.08)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,nrx,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  {const px=PLT.cx*W,py=PLT.cy*H,pr=PLT.r;
  ctx.save();ctx.translate(px,py);ctx.rotate(-.28);ctx.scale(1,.28);
  ctx.beginPath();ctx.arc(0,0,pr*2.1,0,Math.PI*2);ctx.strokeStyle='rgba(90,140,210,.18)';ctx.lineWidth=pr*.22;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,pr*1.65,0,Math.PI*2);ctx.strokeStyle='rgba(110,160,230,.12)';ctx.lineWidth=pr*.14;ctx.stroke();ctx.restore();
  const pg=ctx.createRadialGradient(px-pr*.3,py-pr*.3,pr*.08,px,py,pr);
  pg.addColorStop(0,'#4b6fa8');pg.addColorStop(.4,'#1c3a60');pg.addColorStop(.85,'#0c1e34');pg.addColorStop(1,'#05101e');
  ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
  const atm=ctx.createRadialGradient(px,py,pr*.82,px,py,pr*1.35);
  atm.addColorStop(0,'rgba(80,150,230,.16)');atm.addColorStop(1,'rgba(80,150,230,0)');
  ctx.beginPath();ctx.arc(px,py,pr*1.35,0,Math.PI*2);ctx.fillStyle=atm;ctx.fill();}
  const t=ts/1000;
  stars.forEach(s=>{
    const f=.65+.35*Math.sin(t*s.speed+s.phase),op=s.base*f,sx=s.x*W,sy=s.y*H;
    ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(240,248,255,${op})`;ctx.fill();
    if(s.r>1.3){const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,s.r*4.5);
      glow.addColorStop(0,`rgba(200,230,255,${op*.45})`);glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(sx,sy,s.r*4.5,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();}
  });
  lastSpawn+=dt;
  if(lastSpawn>=nextDelay){spawnShooter();lastSpawn=0;nextDelay=3+Math.random()*6;}
  shooters=shooters.filter(ss=>ss.life<ss.dur);
  shooters.forEach(ss=>{
    ss.life+=dt;
    const prog=ss.life/ss.dur,alpha=prog<.15?prog/.15:prog>.75?(1-prog)/.25:1;
    const cx=(ss.x0+Math.cos(ss.angle)*prog*.55)*W,cy=(ss.y0+Math.sin(ss.angle)*prog*.35)*H;
    const tail=ss.len*Math.min(prog*5,1),ex=cx-Math.cos(ss.angle)*tail,ey=cy-Math.sin(ss.angle)*tail;
    const sg=ctx.createLinearGradient(ex,ey,cx,cy);
    sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.6,`rgba(190,235,255,${alpha*.5})`);sg.addColorStop(1,`rgba(255,255,255,${alpha*.95})`);
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(cx,cy);ctx.strokeStyle=sg;ctx.lineWidth=1.8;ctx.stroke();
    const tip=ctx.createRadialGradient(cx,cy,0,cx,cy,7);
    tip.addColorStop(0,`rgba(255,255,255,${alpha*.9})`);tip.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fillStyle=tip;ctx.fill();
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

const bug=document.getElementById('cursor-bug');

/* ════════════════════════════════════════
   CALENDRIER
════════════════════════════════════════ */
const TODAY      = new Date();
const TODAY_STR  = fmtDate(TODAY);
const MIN_YEAR   = TODAY.getFullYear();
const MIN_MONTH  = TODAY.getMonth();

let viewYear  = MIN_YEAR;
let viewMonth = MIN_MONTH;
let calEvents = [];
let selectedColor = 'blue';
let detailEvent   = null;

const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

const EVENT_COLORS = {
  blue:   'rgba(30,100,220,.85)',
  purple: 'rgba(120,40,200,.85)',
  teal:   'rgba(0,160,180,.85)',
  pink:   'rgba(200,40,120,.85)',
  green:  'rgba(30,180,100,.85)',
  orange: 'rgba(200,120,20,.85)',
};

function fmtDate(d) {
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function parseLocalDate(s) {
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function fmtDisplayDate(s){
  const d=parseLocalDate(s);
  return `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
}


function renderCalendar(){
  document.getElementById('cal-month-label').textContent=`${MONTH_NAMES[viewMonth]} ${viewYear}`;
  document.getElementById('cal-prev').disabled = (viewYear===MIN_YEAR && viewMonth===MIN_MONTH);

  const body=document.getElementById('cal-body');
  body.innerHTML='';

  // Premier jour du mois (lundi=0)
  const firstDay=new Date(viewYear,viewMonth,1);
  let startDow=firstDay.getDay()-1; if(startDow<0)startDow=6; // lundi=0

  // Dernier jour du mois
  const lastDay=new Date(viewYear,viewMonth+1,0).getDate();

  // Construire tableau de toutes les semaines
  let day=new Date(viewYear,viewMonth,1-startDow);

  // On affiche 6 semaines max
  for(let w=0;w<6;w++){
    const weekDays=[];
    for(let d=0;d<7;d++){weekDays.push(new Date(day));day.setDate(day.getDate()+1);}

    // Ne pas afficher si toute la semaine est dans le mois suivant après le dernier jour
    const wStart=weekDays[0],wEnd=weekDays[6];
    if(wStart.getMonth()>viewMonth&&wStart.getFullYear()>=viewYear&&w>=4)break;

    const weekEl=document.createElement('div');
    weekEl.className='cal-week';

    // ── Barre événements ──
    const evtBar=document.createElement('div');
    evtBar.className='cal-eventsbar';

    // Événements qui chevauchent cette semaine
    const wEvts=calEvents.filter(e=>{
      const eS=parseLocalDate(e.startDate),eE=parseLocalDate(e.endDate||e.startDate);
      return eS<=wEnd&&eE>=wStart;
    }).map(e=>({...e}));

    // Trier
    wEvts.sort((a,b)=>{
      const dA=parseLocalDate(a.startDate),dB=parseLocalDate(b.startDate);
      if(dA<dB)return -1;if(dA>dB)return 1;
      const lenA=parseLocalDate(a.endDate||a.startDate)-parseLocalDate(a.startDate);
      const lenB=parseLocalDate(b.endDate||b.startDate)-parseLocalDate(b.startDate);
      return lenB-lenA;
    });

    // Assigner lanes
    const laneFill=[];
    wEvts.forEach(e=>{
      const eS=parseLocalDate(e.startDate);
      let lane=laneFill.findIndex(end=>end<eS);
      if(lane===-1){lane=laneFill.length;laneFill.push(null);}
      laneFill[lane]=parseLocalDate(e.endDate||e.startDate);
      e._lane=lane;
    });

    const maxLanes=Math.min(laneFill.length,3);
    evtBar.style.minHeight=maxLanes>0?(maxLanes*22+4)+'px':'4px';

    wEvts.forEach(e=>{
      if(e._lane>=3)return;
      const eS=parseLocalDate(e.startDate),eE=parseLocalDate(e.endDate||e.startDate);
      const clampS=eS<wStart?wStart:eS;
      const clampE=eE>wEnd?wEnd:eE;
      let sCol=weekDays.findIndex(d=>sameDay(d,clampS));
      let eCol=weekDays.findIndex(d=>sameDay(d,clampE));
      if(sCol<0)sCol=0;if(eCol<0)eCol=6;
      const span=eCol-sCol+1;

      const bar=document.createElement('div');
      bar.className='cal-event-bar';
      bar.style.left=`calc(${sCol}/7*100% + 2px)`;
      bar.style.width=`calc(${span}/7*100% - 4px)`;
      bar.style.top=(e._lane*22+2)+'px';
      bar.style.background=EVENT_COLORS[e.color]||EVENT_COLORS.blue;

      const timeStr=e.startTime?` · ${e.startTime}`:'';
      const contL=eS<wStart?'‹ ':'';
      const contR=eE>wEnd?' ›':'';
      bar.textContent=contL+e.title+timeStr+contR;
      bar.title=e.title;

      // Arrondi selon continuation
      bar.style.borderTopLeftRadius  = eS<wStart?'0':'3px';
      bar.style.borderBottomLeftRadius = eS<wStart?'0':'3px';
      bar.style.borderTopRightRadius  = eE>wEnd?'0':'3px';
      bar.style.borderBottomRightRadius= eE>wEnd?'0':'3px';

      bar.addEventListener('click',ev=>{ev.stopPropagation();showDetail(e);});
      evtBar.appendChild(bar);
    });
    weekEl.appendChild(evtBar);

    // ── Cellules jours ──
    const daysRow=document.createElement('div');
    daysRow.className='cal-week-days';
    weekDays.forEach(wd=>{
      const cell=document.createElement('div');
      cell.className='cal-day-cell';
      const isCurrentM=wd.getMonth()===viewMonth;
      const isPast=wd<new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
      const isTdy=sameDay(wd,TODAY);
      if(!isCurrentM)cell.classList.add('other-month');
      if(isPast)cell.classList.add('past');
      if(isTdy)cell.classList.add('today');

      const num=document.createElement('span');
      num.className='cal-day-num';
      num.textContent=wd.getDate();
      cell.appendChild(num);

      if(!isPast){
        const hint=document.createElement('div');
        hint.className='add-evt-hint';
        hint.textContent='+ événement';
        cell.appendChild(hint);
        cell.addEventListener('click',()=>showEventModal(wd));
      }
      daysRow.appendChild(cell);
    });
    weekEl.appendChild(daysRow);
    body.appendChild(weekEl);
  }
}

function showDetail(event){
  detailEvent=event;
  document.getElementById('detail-colorbar').style.background=EVENT_COLORS[event.color]||EVENT_COLORS.blue;
  document.getElementById('detail-title').textContent=event.title;
  let info=`📅 ${fmtDisplayDate(event.startDate)}`;
  if(event.endDate&&event.endDate!==event.startDate)info+=` → ${fmtDisplayDate(event.endDate)}`;
  if(event.startTime)info+=`\n🕐 ${event.startTime}${event.endTime?' → '+event.endTime:''}`;
  document.getElementById('detail-info').style.whiteSpace='pre-line';
  document.getElementById('detail-info').textContent=info;
  document.getElementById('detail-modal').classList.add('open');
}

/* ── Polling calendrier (sync temps réel, identique au chat) ── */
let lastEventsSignature = null;

async function pollEvents() {
  try {
    const r = await fetch('/api/calendar/events');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const events = await r.json();
    // Signature pour détecter un changement sans re-render inutile
    const sig = events.map(e => e.id + '|' + e.title + '|' + e.startDate + '|' + (e.endDate||'')).join('§');
    if (sig !== lastEventsSignature) {
      lastEventsSignature = sig;
      calEvents = events;
      renderCalendar();
    }
  } catch(e) { console.error('pollEvents error', e); }
}

// Démarrage : chargement immédiat + rafraîchissement toutes les 2.5s
(async () => { await pollEvents(); setInterval(pollEvents, 2500); })();

function fmtTime(iso){const d=new Date(iso);return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function fmtDay(iso){const d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}
function sameDayStr(a,b){return a.slice(0,10)===b.slice(0,10);}

function renderMessages(msgs){
  if(!msgs.length){msgsEl.innerHTML='';msgsEl.appendChild(emptyEl);return;}
  if(emptyEl.parentNode)emptyEl.parentNode.removeChild(emptyEl);
  msgsEl.innerHTML='';
  let lastDate=null;
  msgs.forEach(m=>{
    if(!lastDate||!sameDayStr(m.timestamp,lastDate)){
      const sep=document.createElement('div');sep.className='date-sep';sep.textContent=fmtDay(m.timestamp);
      msgsEl.appendChild(sep);lastDate=m.timestamp;
    }
    const isMe=(myRole==='owner'&&m.sender==='owner')||(myRole==='guest'&&m.sender==='guest');
    const row=document.createElement('div');row.className='msg-row '+(isMe?'me':'other');
    const nm=document.createElement('div');nm.className='msg-name';nm.textContent=m.name;
    const bbl=document.createElement('div');bbl.className='msg-bubble';bbl.textContent=m.text;
    const tm=document.createElement('div');tm.className='msg-time';tm.textContent=fmtTime(m.timestamp);
    row.appendChild(nm);row.appendChild(bbl);row.appendChild(tm);
    msgsEl.appendChild(row);
  });
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

async function loadWhoami(){
  try{
    const r=await fetch('/api/chat/whoami');
    const d=await r.json();
    myRole=d.role;
    myName=d.role==='owner'?d.name:(guestName||d.name);
    nameEl.textContent=myName;
  }catch(e){nameEl.textContent='?';}
}

async function fetchMessages(){
  try{
    const r=await fetch('/api/chat/messages');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const msgs=await r.json();
    const sig=msgs.map(m=>m.timestamp+m.text).join('|');
    const lastSig=lastMessages.map(m=>m.timestamp+m.text).join('|');
    if(sig!==lastSig){lastMessages=msgs;renderMessages(msgs);}
    statusEl.textContent='';
  }catch(e){statusEl.textContent='⚠ Connexion interrompue…';}
}

async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text)return;
  sendBtn.disabled=true;inputEl.disabled=true;statusEl.textContent='Envoi…';
  try{
    await fetch('/api/chat/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,guestName:guestName||undefined}),
    });
    inputEl.value='';await fetchMessages();statusEl.textContent='';
  }catch(e){statusEl.textContent='⚠ Erreur lors de l\'envoi';}
  finally{sendBtn.disabled=false;inputEl.disabled=false;inputEl.focus();}
}

sendBtn.addEventListener('click',sendMessage);
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});

(async()=>{await loadWhoami();fetchMessages();setInterval(fetchMessages,2500);})();
</script>
</body>
</html>
