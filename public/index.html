<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NebuDate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000510; cursor:none !important; }
    * { cursor: none !important; }

    #space-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

    #main-content {
      position:fixed; inset:0; z-index:10;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2.2rem; pointer-events:none;
    }

    .logo-main {
      font-family:'Orbitron',sans-serif; font-weight:900;
      font-size:clamp(3.2rem,9vw,7.5rem); letter-spacing:0.18em; text-transform:uppercase;
      background:linear-gradient(130deg,#9adcff 0%,#ddf0ff 30%,#ffffff 50%,#d4bfff 72%,#8ba8ff 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      animation:pulseGlow 4s ease-in-out infinite alternate; will-change:filter;
    }
    @keyframes pulseGlow {
      from { filter:drop-shadow(0 0 18px rgba(154,220,255,.55)) drop-shadow(0 0 50px rgba(139,168,255,.2)); }
      to   { filter:drop-shadow(0 0 35px rgba(154,220,255,.95)) drop-shadow(0 0 90px rgba(212,191,255,.45)); }
    }

    .question {
      font-family:'Syne',sans-serif; font-weight:300;
      font-size:clamp(.95rem,2.2vw,1.35rem); color:rgba(195,220,255,.80);
      letter-spacing:.06em; text-align:center; text-shadow:0 0 22px rgba(154,220,255,.35);
    }

    .buttons-zone {
      display:flex; flex-direction:column; align-items:center;
      gap:1.1rem; pointer-events:all;
    }

    .btn {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.88rem;
      letter-spacing:.18em; text-transform:uppercase; padding:.9rem 3rem;
      border-radius:2px; border:none; cursor:none !important;
      position:relative; overflow:hidden; outline:none; width:200px;
    }
    .btn::before {
      content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.13) 50%,transparent 80%);
      transition:left .55s ease; pointer-events:none;
    }
    .btn:hover::before { left:160%; }

    #btn-louis {
      background:linear-gradient(160deg,#0e2850 0%,#163775 50%,#0a1f40 100%);
      color:#b8e6ff; text-shadow:0 0 14px rgba(154,220,255,.6);
      box-shadow:0 0 0 1px rgba(154,220,255,.22),0 0 28px rgba(26,63,140,.7),
                 0 0 8px rgba(154,220,255,.18),inset 0 1px 0 rgba(154,220,255,.12),
                 inset 0 -1px 0 rgba(0,0,0,.4);
      transition:transform .28s cubic-bezier(.22,.68,0,1.3),box-shadow .28s ease,color .2s;
    }
    #btn-louis:hover {
      transform:translateY(-4px) scale(1.06); color:#e8f8ff;
      box-shadow:0 0 0 1px rgba(154,220,255,.55),0 6px 40px rgba(26,63,140,.85),
                 0 0 25px rgba(154,220,255,.55),0 0 60px rgba(80,160,255,.2),
                 inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.4);
    }
    #btn-louis:active { transform:scale(.97) translateY(0); transition:transform .08s; }

    #btn-autres {
      background:linear-gradient(160deg,#1a0b32 0%,#2e1460 50%,#150929 100%);
      color:#cbb5ff; text-shadow:0 0 14px rgba(196,173,255,.5);
      box-shadow:0 0 0 1px rgba(196,173,255,.18),0 0 28px rgba(58,20,110,.7),
                 0 0 8px rgba(196,173,255,.14),inset 0 1px 0 rgba(196,173,255,.10),
                 inset 0 -1px 0 rgba(0,0,0,.4);
      position:fixed; transition:box-shadow .25s ease,color .2s;
    }
    #btn-autres:hover {
      color:#e8dcff;
      box-shadow:0 0 0 1px rgba(196,173,255,.5),0 6px 40px rgba(58,20,110,.85),
                 0 0 25px rgba(196,173,255,.5),0 0 60px rgba(150,80,255,.2),
                 inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.4);
    }

    #logo-small {
      position:fixed; top:1.4rem; right:2rem;
      font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.1rem;
      letter-spacing:.18em; text-transform:uppercase;
      background:linear-gradient(130deg,#9adcff 0%,#ffffff 45%,#c8b8ff 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 10px rgba(154,220,255,.5));
      z-index:100; opacity:0; visibility:hidden; transition:opacity .9s ease;
    }

    /* ══ COCCINELLE ══ */
    /* Wrapper 0×0 positionné exactement sur le curseur.
       La rotation s'applique autour de ce point (= tête du bug). */
    #cursor-bug {
      position:fixed; pointer-events:none; z-index:99999;
      top:0; left:0; width:0; height:0;
    }
    /* Corps décalé pour que la tête soit au point d'ancrage */
    #bug-body {
      position:absolute;
      transform:translate(-50%, -28%);
      will-change:transform;
    }

    .fw { opacity:0; transition:opacity .12s ease; }
    .fw-l { transform-box:fill-box; transform-origin:right center; }
    .fw-r { transform-box:fill-box; transform-origin:left center; }

    #cursor-bug.is-flying .fw         { opacity:1; }
    #cursor-bug.is-flying .fw-l       { animation:flapL .13s ease-in-out infinite alternate; }
    #cursor-bug.is-flying .fw-r       { animation:flapR .13s ease-in-out infinite alternate; }

    @keyframes flapL {
      from { transform:rotate(-6deg)  scaleY(.60); }
      to   { transform:rotate(-42deg) scaleY(1.0); }
    }
    @keyframes flapR {
      from { transform:rotate(6deg)   scaleY(.60); }
      to   { transform:rotate(42deg)  scaleY(1.0); }
    }

    /* ══ MODAL NOM ══ */
    #name-modal {
      display:none; position:fixed; inset:0; z-index:200;
      background:rgba(0,3,16,.82); backdrop-filter:blur(8px);
      align-items:center; justify-content:center;
    }
    #name-modal.open { display:flex; }
    .name-box {
      background:rgba(4,12,34,.92);
      border:1px solid rgba(154,220,255,.2);
      border-radius:6px; padding:2rem 2.4rem 1.8rem;
      box-shadow:0 0 60px rgba(26,63,140,.55),0 0 0 1px rgba(154,220,255,.06) inset;
      display:flex; flex-direction:column; gap:1.1rem; width:320px;
      animation:boxIn .3s cubic-bezier(.22,.68,0,1.2);
    }
    @keyframes boxIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    .name-box h2 {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.95rem;
      letter-spacing:.18em; text-transform:uppercase;
      background:linear-gradient(130deg,#9adcff,#fff 50%,#c8b8ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .name-box p {
      font-family:'Syne',sans-serif; font-size:.85rem;
      color:rgba(195,220,255,.65); letter-spacing:.04em;
    }
    .name-input {
      background:rgba(5,15,40,.7); border:1px solid rgba(154,220,255,.18);
      border-radius:3px; padding:.6rem .85rem;
      font-family:'Syne',sans-serif; font-size:.95rem;
      color:rgba(220,240,255,.95); outline:none; cursor:auto !important;
      caret-color:rgba(154,220,255,.9); transition:border-color .2s;
    }
    .name-input:focus { border-color:rgba(154,220,255,.42); }
    .name-input::placeholder { color:rgba(154,220,255,.25); }
    .name-submit {
      font-family:'Orbitron',sans-serif; font-weight:700; font-size:.75rem;
      letter-spacing:.16em; text-transform:uppercase; padding:.65rem 1.4rem;
      border:1px solid rgba(154,220,255,.25); border-radius:3px;
      background:linear-gradient(160deg,rgba(10,28,70,.9),rgba(18,45,100,.9));
      color:rgba(154,220,255,.8); cursor:none !important; align-self:flex-end;
      transition:color .2s,box-shadow .2s,transform .15s,border-color .2s;
    }
    .name-submit:hover {
      color:#9adcff; border-color:rgba(154,220,255,.5);
      box-shadow:0 0 18px rgba(154,220,255,.25); transform:translateY(-1px);
    }
    .name-submit:active { transform:scale(.97); }
  </style>
</head>
<body>

<canvas id="space-canvas"></canvas>

<div id="main-content">
  <h1 class="logo-main">NebuDate</h1>
  <p class="question">Avec qui voulez-vous réserver un date&nbsp;?</p>
  <div class="buttons-zone">
    <button class="btn" id="btn-louis">Louis</button>
    <div id="autres-placeholder" style="width:200px;height:44px;opacity:0;pointer-events:none;"></div>
  </div>
</div>

<button class="btn" id="btn-autres">Autres</button>
<div id="logo-small">NebuDate</div>

<!-- MODAL NOM -->
<div id="name-modal">
  <div class="name-box">
    <h2>Réservation Louis</h2>
    <p>Entrez votre prénom pour commencer la réservation.</p>
    <input class="name-input" id="name-input" type="text" placeholder="Votre prénom…" maxlength="30" autocomplete="off">
    <button class="name-submit" id="name-submit">Continuer →</button>
  </div>
</div>

<!-- COCCINELLE -->
<div id="cursor-bug">
  <div id="bug-body">
    <svg viewBox="0 0 80 64" width="76" height="70" style="overflow:visible" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="elytra-shine" cx="38%" cy="28%" r="62%">
          <stop offset="0%"   stop-color="rgba(255,160,160,.40)"/>
          <stop offset="55%"  stop-color="rgba(180,0,0,.05)"/>
          <stop offset="100%" stop-color="rgba(60,0,0,.15)"/>
        </radialGradient>
        <filter id="wing-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
      </defs>
      <!-- Ailes -->
      <g class="fw fw-l">
        <path d="M40,31 C34,20 16,12 4,20 C-3,27 2,40 12,40 C25,43 38,35 40,31Z"
              fill="rgba(210,238,255,.52)" stroke="rgba(170,215,255,.55)" stroke-width=".6" filter="url(#wing-blur)"/>
        <line x1="40" y1="31" x2="14" y2="19" stroke="rgba(180,220,255,.4)" stroke-width=".7"/>
        <line x1="40" y1="31" x2="6"  y2="29" stroke="rgba(180,220,255,.3)" stroke-width=".6"/>
        <line x1="40" y1="31" x2="14" y2="40" stroke="rgba(180,220,255,.3)" stroke-width=".5"/>
      </g>
      <g class="fw fw-r">
        <path d="M40,31 C46,20 64,12 76,20 C83,27 78,40 68,40 C55,43 42,35 40,31Z"
              fill="rgba(210,238,255,.52)" stroke="rgba(170,215,255,.55)" stroke-width=".6" filter="url(#wing-blur)"/>
        <line x1="40" y1="31" x2="66" y2="19" stroke="rgba(180,220,255,.4)" stroke-width=".7"/>
        <line x1="40" y1="31" x2="74" y2="29" stroke="rgba(180,220,255,.3)" stroke-width=".6"/>
        <line x1="40" y1="31" x2="66" y2="40" stroke="rgba(180,220,255,.3)" stroke-width=".5"/>
      </g>
      <!-- Ombre corps -->
      <ellipse cx="41.5" cy="38" rx="13.5" ry="17.5" fill="rgba(0,0,0,.30)"/>
      <!-- Élytres -->
      <ellipse cx="40" cy="36" rx="13.5" ry="17.5" fill="#c41515"/>
      <ellipse cx="40" cy="36" rx="13.5" ry="17.5" fill="url(#elytra-shine)"/>
      <ellipse cx="36.5" cy="26" rx="4.5" ry="6.5" fill="rgba(255,255,255,.12)" transform="rotate(-12,36.5,26)"/>
      <!-- Ligne élytres -->
      <line x1="40" y1="19" x2="40" y2="52.5" stroke="#0d0d0d" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Bordure -->
      <ellipse cx="40" cy="36" rx="13.5" ry="17.5" fill="none" stroke="#0d0d0d" stroke-width="1.3"/>
      <!-- Taches -->
      <circle cx="33.5" cy="28" r="3.4" fill="#0d0d0d"/>
      <circle cx="46.5" cy="28" r="3.4" fill="#0d0d0d"/>
      <circle cx="33"   cy="39" r="3.0" fill="#0d0d0d"/>
      <circle cx="47"   cy="39" r="3.0" fill="#0d0d0d"/>
      <circle cx="35.5" cy="49" r="2.1" fill="#0d0d0d"/>
      <circle cx="44.5" cy="49" r="2.1" fill="#0d0d0d"/>
      <!-- Tête -->
      <circle cx="40" cy="16" r="10" fill="#111"/>
      <ellipse cx="37" cy="13" rx="3.2" ry="2.2" fill="rgba(255,255,255,.14)" transform="rotate(-20,37,13)"/>
      <circle cx="35.5" cy="15" r="2.2" fill="#000"/>
      <circle cx="44.5" cy="15" r="2.2" fill="#000"/>
      <circle cx="35"   cy="14.5" r=".7" fill="rgba(255,255,255,.6)"/>
      <circle cx="44"   cy="14.5" r=".7" fill="rgba(255,255,255,.6)"/>
      <!-- Antennes -->
      <path d="M36,8 Q27,1 22,-4"  stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M44,8 Q53,1 58,-4"  stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="22" cy="-4" r="2.2" fill="#222"/>
      <circle cx="58" cy="-4" r="2.2" fill="#222"/>
    </svg>
  </div>
</div>

<script>
/* ── CANVAS ESPACE ── */
const canvas=document.getElementById('space-canvas'), ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);
const NSTARS=380;
const stars=Array.from({length:NSTARS},()=>({
  x:Math.random(),y:Math.random(),r:Math.pow(Math.random(),2)*2+.25,
  base:Math.random()*.6+.25,speed:Math.random()*.8+.3,phase:Math.random()*Math.PI*2
}));
const nebulae=[
  {cx:.14,cy:.28,rx:.32,ry:.20,rot:.4, c1:'rgba(55,0,110,', c2:'rgba(0,35,95,'},
  {cx:.78,cy:.62,rx:.26,ry:.18,rot:-.2,c1:'rgba(0,70,110,', c2:'rgba(50,0,90,'},
  {cx:.52,cy:.12,rx:.22,ry:.14,rot:.1, c1:'rgba(0,55,80,',  c2:'rgba(35,0,95,'},
  {cx:.85,cy:.80,rx:.20,ry:.12,rot:.6, c1:'rgba(80,0,80,',  c2:'rgba(0,40,80,'},
];
const PLT={cx:.80,cy:.20,r:55};
let shooters=[],lastSpawn=0,nextDelay=3+Math.random()*5;
function spawnShooter(){
  const angle=Math.PI/5+(Math.random()-.5)*.4;
  shooters.push({x0:Math.random()*.7,y0:Math.random()*.35,angle,
    len:90+Math.random()*130,spd:.35+Math.random()*.25,life:0,dur:1.6+Math.random()*.8});
}
let lastT=0;
function draw(ts){
  const dt=Math.min((ts-lastT)/1000,.05); lastT=ts;
  const bg=ctx.createLinearGradient(0,0,W*.4,H);
  bg.addColorStop(0,'#000610');bg.addColorStop(.5,'#020a1c');bg.addColorStop(1,'#010611');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  nebulae.forEach(n=>{
    const nx=n.cx*W,ny=n.cy*H,nrx=n.rx*Math.min(W,H),nry=n.ry*Math.min(W,H);
    ctx.save();ctx.translate(nx,ny);ctx.rotate(n.rot);ctx.scale(1,nry/nrx);
    const g=ctx.createRadialGradient(0,0,0,0,0,nrx);
    g.addColorStop(0,n.c1+'0.16)');g.addColorStop(.45,n.c2+'0.08)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,nrx,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  {
    const px=PLT.cx*W,py=PLT.cy*H,pr=PLT.r;
    ctx.save();ctx.translate(px,py);ctx.rotate(-.28);ctx.scale(1,.28);
    ctx.beginPath();ctx.arc(0,0,pr*2.1,0,Math.PI*2);ctx.strokeStyle='rgba(90,140,210,.18)';ctx.lineWidth=pr*.22;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,pr*1.65,0,Math.PI*2);ctx.strokeStyle='rgba(110,160,230,.12)';ctx.lineWidth=pr*.14;ctx.stroke();ctx.restore();
    const pg=ctx.createRadialGradient(px-pr*.3,py-pr*.3,pr*.08,px,py,pr);
    pg.addColorStop(0,'#4b6fa8');pg.addColorStop(.4,'#1c3a60');pg.addColorStop(.85,'#0c1e34');pg.addColorStop(1,'#05101e');
    ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
    const atm=ctx.createRadialGradient(px,py,pr*.82,px,py,pr*1.35);
    atm.addColorStop(0,'rgba(80,150,230,.16)');atm.addColorStop(1,'rgba(80,150,230,0)');
    ctx.beginPath();ctx.arc(px,py,pr*1.35,0,Math.PI*2);ctx.fillStyle=atm;ctx.fill();
  }
  const t=ts/1000;
  stars.forEach(s=>{
    const f=.65+.35*Math.sin(t*s.speed+s.phase),op=s.base*f,sx=s.x*W,sy=s.y*H;
    ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(240,248,255,${op})`;ctx.fill();
    if(s.r>1.3){
      const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,s.r*4.5);
      glow.addColorStop(0,`rgba(200,230,255,${op*.45})`);glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(sx,sy,s.r*4.5,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    }
  });
  lastSpawn+=dt;
  if(lastSpawn>=nextDelay){spawnShooter();lastSpawn=0;nextDelay=3+Math.random()*6;}
  shooters=shooters.filter(ss=>ss.life<ss.dur);
  shooters.forEach(ss=>{
    ss.life+=dt;
    const prog=ss.life/ss.dur,alpha=prog<.15?prog/.15:prog>.75?(1-prog)/.25:1;
    const cx=(ss.x0+Math.cos(ss.angle)*prog*.55)*W,cy=(ss.y0+Math.sin(ss.angle)*prog*.35)*H;
    const tail=ss.len*Math.min(prog*5,1),ex=cx-Math.cos(ss.angle)*tail,ey=cy-Math.sin(ss.angle)*tail;
    const sg=ctx.createLinearGradient(ex,ey,cx,cy);
    sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.6,`rgba(190,235,255,${alpha*.5})`);sg.addColorStop(1,`rgba(255,255,255,${alpha*.95})`);
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(cx,cy);ctx.strokeStyle=sg;ctx.lineWidth=1.8;ctx.stroke();
    const tip=ctx.createRadialGradient(cx,cy,0,cx,cy,7);
    tip.addColorStop(0,`rgba(255,255,255,${alpha*.9})`);tip.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fillStyle=tip;ctx.fill();
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ── BOUTON AUTRES ── */
const btnAutres=document.getElementById('btn-autres'),
      btnLouis=document.getElementById('btn-louis'),
      placeholder=document.getElementById('autres-placeholder'),
      mainContent=document.getElementById('main-content'),
      logoSmall=document.getElementById('logo-small');
let autresX=0,autresY=0,autresActive=true;

function placeAutresOnPlaceholder(){
  const pr=placeholder.getBoundingClientRect();
  autresX=pr.left;autresY=pr.top;applyAutresPos();
}
function applyAutresPos(){btnAutres.style.left=autresX+'px';btnAutres.style.top=autresY+'px';}
document.fonts.ready.then(placeAutresOnPlaceholder);
window.addEventListener('resize',placeAutresOnPlaceholder);

function teleportAway(mx,my){
  const bw=btnAutres.offsetWidth||200,bh=btnAutres.offsetHeight||44;
  const margin=50,maxX=window.innerWidth-bw-margin,maxY=window.innerHeight-bh-margin;
  let nx,ny,att=0;
  do{nx=margin+Math.random()*(maxX-margin);ny=margin+Math.random()*(maxY-margin);att++;}
  while(Math.hypot(nx+bw/2-(mx??W/2),ny+bh/2-(my??H/2))<300&&att<40);
  autresX=nx;autresY=ny;applyAutresPos();
}
const FLEE_R=145,FLEE_D=185,CORNER_M=100;
let lastMX=-9999,lastMY=-9999;

document.addEventListener('mousemove',e=>{
  if(!autresActive)return;
  lastMX=e.clientX;lastMY=e.clientY;
  const bw=btnAutres.offsetWidth||200,bh=btnAutres.offsetHeight||44;
  const cx=autresX+bw/2,cy=autresY+bh/2,dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy);
  if(dist<FLEE_R){
    const angle=Math.atan2(dy,dx);
    let nx=autresX-Math.cos(angle)*FLEE_D,ny=autresY-Math.sin(angle)*FLEE_D;
    const m=10;
    nx=Math.max(m,Math.min(window.innerWidth-bw-m,nx));
    ny=Math.max(m,Math.min(window.innerHeight-bh-m,ny));
    autresX=nx;autresY=ny;applyAutresPos();
    const nL=autresX<CORNER_M,nR=autresX>window.innerWidth-bw-CORNER_M;
    const nT=autresY<CORNER_M,nB=autresY>window.innerHeight-bh-CORNER_M;
    if((nL||nR)&&(nT||nB))teleportAway(e.clientX,e.clientY);
  }
});
btnAutres.addEventListener('mouseenter',e=>{if(!autresActive)return;teleportAway(e.clientX,e.clientY);});
setInterval(()=>{
  if(!autresActive)return;
  const bw=btnAutres.offsetWidth||200,bh=btnAutres.offsetHeight||44;
  const r={l:autresX,r:autresX+bw,t:autresY,b:autresY+bh};
  if(lastMX>=r.l&&lastMX<=r.r&&lastMY>=r.t&&lastMY<=r.b)teleportAway(lastMX,lastMY);
},150);

/* ── MODAL NOM + NAVIGATION LOUIS ── */
const nameModal  = document.getElementById('name-modal');
const nameInput  = document.getElementById('name-input');
const nameSubmit = document.getElementById('name-submit');

// Pré-remplir si déjà saisi
const storedName = localStorage.getItem('nebudate_guest_name');
if (storedName) nameInput.value = storedName;

function doNavigate() {
  const n = nameInput.value.trim();
  if (n) localStorage.setItem('nebudate_guest_name', n);
  else   localStorage.removeItem('nebudate_guest_name');
  // Fade out
  autresActive = false;
  mainContent.style.transition='opacity .75s ease'; mainContent.style.opacity='0';
  btnAutres.style.transition='opacity .75s ease';   btnAutres.style.opacity='0';
  nameModal.style.transition='opacity .5s ease';    nameModal.style.opacity='0';
  document.getElementById('cursor-bug').style.transition='opacity .75s ease';
  document.getElementById('cursor-bug').style.opacity='0';
  setTimeout(()=>{ window.location.href='louis.html'; }, 800);
}

btnLouis.addEventListener('click',()=>{
  nameModal.classList.add('open');
  setTimeout(()=>nameInput.focus(), 50);
});

nameSubmit.addEventListener('click', doNavigate);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doNavigate(); });

/* ── COCCINELLE – orientation + battement ── */
const bug      = document.getElementById('cursor-bug');
const bugBody  = document.getElementById('bug-body');
let bugAngle   = 0;   // angle affiché (lissé)
let targetAngle= 0;   // angle cible
let prevMX2=null, prevMY2=null;
let moveTimer=null;

/* Lerp d'angle avec gestion du wrap 360° */
function lerpAngle(a,b,t){
  let d=((b-a)%360+540)%360-180;
  return a+d*t;
}

/* Boucle d'animation de la rotation */
(function bugLoop(){
  bugAngle=lerpAngle(bugAngle,targetAngle,.16);
  bug.style.transform=`rotate(${bugAngle}deg)`;
  requestAnimationFrame(bugLoop);
})();

document.addEventListener('mousemove',e=>{
  /* Position : le wrapper est à 0×0, positionné sur le curseur */
  bug.style.left=e.clientX+'px';
  bug.style.top =e.clientY+'px';

  /* Calcul de la direction du mouvement */
  if(prevMX2!==null){
    const dx=e.clientX-prevMX2, dy=e.clientY-prevMY2;
    /* Seuil de 2.5px pour éviter le jitter */
    if(Math.hypot(dx,dy)>2.5){
      /* atan2 donne l'angle où 0=droite, +y=bas.
         La tête pointe vers le haut par défaut → +90° de décalage */
      targetAngle=Math.atan2(dy,dx)*180/Math.PI+90;
    }
  }
  prevMX2=e.clientX; prevMY2=e.clientY;

  /* Battement d'ailes */
  bug.classList.add('is-flying');
  clearTimeout(moveTimer);
  moveTimer=setTimeout(()=>bug.classList.remove('is-flying'),150);
});

document.addEventListener('mouseleave',()=>{
  clearTimeout(moveTimer);
  bug.classList.remove('is-flying');
  bug.style.opacity='0';
});
document.addEventListener('mouseenter',()=>{ bug.style.opacity='1'; });
</script>
